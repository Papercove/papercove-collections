name: Build OPML

on:
  push:
    branches: [main]
    paths:
      - "collections/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_opml.py
      - name: Commit generated OPML
        run: |
          git add -A opml
          if git diff --cached --quiet; then
            echo "OPML already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate OPML files"
          git push
